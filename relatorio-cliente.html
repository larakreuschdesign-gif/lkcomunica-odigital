<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>LK Analytics - Relatório para Cliente</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js"></script>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
            background: #F5EFEA;
            color: #333;
        }

        .container {
            display: flex;
            min-height: 100vh;
        }

        /* SIDEBAR */
        .sidebar {
            width: 260px;
            background: white;
            border-right: 1px solid #E0D5D0;
            padding: 25px;
            display: flex;
            flex-direction: column;
            position: fixed;
            height: 100vh;
            overflow-y: auto;
        }

        .logo {
            display: flex;
            align-items: center;
            gap: 12px;
            margin-bottom: 40px;
        }

        .logo-icon {
            width: 45px;
            height: 45px;
            background: linear-gradient(135deg, #E61E6E, #B81253);
            border-radius: 12px;
            display: flex;
            align-items: center;
            justify-content: center;
            color: white;
            font-weight: bold;
            font-size: 20px;
        }

        .logo h1 {
            font-size: 18px;
            font-weight: 700;
        }

        .nav {
            flex: 1;
            display: flex;
            flex-direction: column;
            gap: 8px;
        }

        .nav-btn {
            padding: 12px 16px;
            border: none;
            background: transparent;
            color: #666;
            border-radius: 10px;
            cursor: pointer;
            text-align: left;
            font-size: 14px;
            font-weight: 500;
            transition: all 0.3s;
            width: 100%;
        }

        .nav-btn:hover {
            background: #F5EFEA;
            color: #E61E6E;
        }

        .nav-btn.active {
            background: #E61E6E;
            color: white;
        }

        /* MAIN */
        .main {
            flex: 1;
            margin-left: 260px;
            display: flex;
            flex-direction: column;
        }

        .header {
            background: white;
            padding: 20px 40px;
            border-bottom: 1px solid #E0D5D0;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .header h1 {
            font-size: 24px;
            font-weight: 700;
        }

        .content {
            flex: 1;
            overflow-y: auto;
            padding: 30px 40px;
        }

        .form-group {
            margin-bottom: 20px;
        }

        .form-group label {
            display: block;
            margin-bottom: 8px;
            font-weight: 600;
            color: #333;
            font-size: 14px;
        }

        .form-group input,
        .form-group textarea,
        .form-group select {
            width: 100%;
            padding: 12px;
            border: 1px solid #E0D5D0;
            border-radius: 8px;
            font-family: inherit;
            font-size: 14px;
        }

        .form-group textarea {
            resize: vertical;
            min-height: 100px;
        }

        .form-row {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 20px;
        }

        .btn {
            padding: 10px 20px;
            border: none;
            border-radius: 10px;
            cursor: pointer;
            font-weight: 600;
            transition: all 0.3s;
            font-size: 14px;
        }

        .btn-primary {
            background: #E61E6E;
            color: white;
        }

        .btn-primary:hover {
            background: #B81253;
        }

        .btn-secondary {
            background: white;
            color: #E61E6E;
            border: 2px solid #E61E6E;
        }

        .btn-secondary:hover {
            background: #F5EFEA;
        }

        .upload-area {
            border: 2px dashed #E61E6E;
            border-radius: 8px;
            background: #F5EFEA;
            padding: 40px;
            text-align: center;
            cursor: pointer;
            transition: all 0.3s;
            margin-bottom: 20px;
        }

        .upload-area:hover {
            background: #F0E8E0;
            border-color: #B81253;
        }

        .upload-area p {
            color: #666;
            margin: 10px 0;
        }

        /* PREVIEW SECTION */
        .section {
            display: none;
        }

        .section.active {
            display: block;
        }

        .preview-container {
            background: white;
            border-radius: 12px;
            padding: 40px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.08);
            margin-bottom: 30px;
        }

        /* RELATÓRIO TEMPLATE */
        .relatorio {
            background: white;
            padding: 60px;
            margin: 0 auto;
            max-width: 900px;
            box-shadow: 0 0 20px rgba(0,0,0,0.1);
        }

        .relatorio-header {
            text-align: center;
            margin-bottom: 50px;
            padding-bottom: 30px;
            border-bottom: 3px solid #E61E6E;
        }

        .relatorio-header .logo {
            justify-content: center;
            margin-bottom: 20px;
        }

        .relatorio-header h1 {
            font-size: 36px;
            color: #333;
            margin-bottom: 10px;
        }

        .relatorio-header .subtitle {
            font-size: 18px;
            color: #E61E6E;
            font-weight: 600;
        }

        .relatorio-header .period {
            font-size: 14px;
            color: #999;
            margin-top: 10px;
        }

        .section-title {
            font-size: 24px;
            color: #E61E6E;
            margin: 40px 0 20px 0;
            padding-bottom: 10px;
            border-bottom: 2px solid #E0D5D0;
        }

        .section-content {
            font-size: 15px;
            line-height: 1.8;
            color: #555;
            margin-bottom: 30px;
        }

        .kpi-grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 20px;
            margin: 30px 0;
        }

        .kpi-card {
            background: #F5EFEA;
            padding: 20px;
            border-radius: 8px;
            border-left: 4px solid #E61E6E;
        }

        .kpi-label {
            font-size: 12px;
            color: #999;
            font-weight: 600;
            text-transform: uppercase;
            margin-bottom: 8px;
        }

        .kpi-value {
            font-size: 28px;
            font-weight: 700;
            color: #E61E6E;
        }

        .recommendations {
            list-style: none;
            margin: 20px 0;
        }

        .recommendations li {
            padding: 15px;
            margin: 10px 0;
            background: #F5EFEA;
            border-radius: 8px;
            border-left: 4px solid #E61E6E;
        }

        .recommendations li strong {
            color: #E61E6E;
        }

        .relatorio-footer {
            margin-top: 50px;
            padding-top: 30px;
            border-top: 2px solid #E0D5D0;
            text-align: center;
            color: #999;
            font-size: 12px;
        }

        .relatorio-footer p {
            margin: 5px 0;
        }

        /* PRINT STYLES */
        @media print {
            body {
                background: white;
            }

            .sidebar, .header, .content {
                display: none;
            }

            .relatorio {
                box-shadow: none;
                padding: 0;
                max-width: 100%;
            }
        }

        .buttons-group {
            display: flex;
            gap: 10px;
            margin-top: 20px;
        }

        .section-column {
            background: white;
            border-radius: 12px;
            padding: 20px;
            margin-bottom: 20px;
            border: 1px solid #E0D5D0;
        }

        .section-column label {
            font-weight: 600;
            color: #333;
            margin-bottom: 10px;
            display: block;
        }

        .section-column textarea {
            width: 100%;
            padding: 12px;
            border: 1px solid #E0D5D0;
            border-radius: 8px;
            font-family: inherit;
            font-size: 14px;
            resize: vertical;
            min-height: 100px;
        }
    </style>
</head>
<body>
    <div class="container">
        <!-- SIDEBAR -->
        <div class="sidebar">
            <div class="logo">
                <div class="logo-icon">📊</div>
                <div>
                    <h1>LK Analytics</h1>
                    <p style="font-size: 11px; color: #999;">Cliente</p>
                </div>
            </div>
            <nav class="nav">
                <button class="nav-btn active" onclick="showSection('editor')">📝 Editor</button>
                <button class="nav-btn" onclick="showSection('preview')">👁️ Prévia</button>
            </nav>
        </div>

        <!-- MAIN -->
        <div class="main">
            <div class="header">
                <h1>Gerador de Relatório para Cliente</h1>
                <div style="display: flex; gap: 10px;">
                    <button class="btn btn-secondary btn-small" onclick="downloadPDF()">📥 Baixar PDF</button>
                    <button class="btn btn-primary btn-small" onclick="printReport()">🖨️ Imprimir</button>
                </div>
            </div>

            <!-- EDITOR SECTION -->
            <div id="editor" class="section active">
                <div class="content">
                    <h2 style="margin-bottom: 20px; color: #333;">Informações do Relatório</h2>

                    <div class="form-row">
                        <div class="form-group">
                            <label>Nome do Cliente *</label>
                            <input type="text" id="clientName" placeholder="Ex: Terraza Urbanismo" required>
                        </div>
                        <div class="form-group">
                            <label>Período *</label>
                            <input type="text" id="period" placeholder="Ex: Junho de 2024" required>
                        </div>
                    </div>

                    <div class="form-group">
                        <label>Título do Relatório</label>
                        <input type="text" id="reportTitle" placeholder="Ex: Análise de Desempenho em Redes Sociais">
                    </div>

                    <hr style="margin: 30px 0; border: none; border-top: 1px solid #E0D5D0;">

                    <h2 style="margin-bottom: 20px; color: #333;">📊 Seções do Relatório</h2>

                    <!-- RESUMO EXECUTIVO -->
                    <div class="section-column">
                        <label>📝 Resumo Executivo</label>
                        <textarea id="executive" placeholder="Escreva um resumo dos principais pontos..."></textarea>
                    </div>

                    <!-- KPIs -->
                    <div class="section-column">
                        <label>📊 KPIs Principais (3 KPIs)</label>
                        <div class="form-row" style="margin-bottom: 15px;">
                            <div>
                                <input type="text" id="kpi1Label" placeholder="Rótulo (ex: Alcance)" style="margin-bottom: 5px;">
                                <input type="text" id="kpi1Value" placeholder="Valor (ex: 15.234)">
                            </div>
                            <div>
                                <input type="text" id="kpi2Label" placeholder="Rótulo" style="margin-bottom: 5px;">
                                <input type="text" id="kpi2Value" placeholder="Valor">
                            </div>
                        </div>
                        <div class="form-row">
                            <div>
                                <input type="text" id="kpi3Label" placeholder="Rótulo" style="margin-bottom: 5px;">
                                <input type="text" id="kpi3Value" placeholder="Valor">
                            </div>
                        </div>
                    </div>

                    <!-- ANÁLISE -->
                    <div class="section-column">
                        <label>📈 Análise Detalhada</label>
                        <textarea id="analysis" placeholder="Descreva a análise dos dados..."></textarea>
                    </div>

                    <!-- INSIGHTS -->
                    <div class="section-column">
                        <label>💡 Principais Insights</label>
                        <textarea id="insights" placeholder="Bullet points dos insights principais (um por linha)"></textarea>
                    </div>

                    <!-- RECOMENDAÇÕES -->
                    <div class="section-column">
                        <label>🎯 Recomendações</label>
                        <textarea id="recommendations" placeholder="Recomendações (uma por linha)"></textarea>
                    </div>

                    <!-- RODAPÉ -->
                    <div class="section-column">
                        <label>Notas Finais</label>
                        <textarea id="footer" placeholder="Notas ou próximos passos..."></textarea>
                    </div>

                    <div style="display: flex; gap: 10px; margin-top: 30px;">
                        <button class="btn btn-primary" onclick="showSection('preview')">👁️ Ver Prévia</button>
                        <button class="btn btn-secondary" onclick="clearAll()">🔄 Limpar Tudo</button>
                    </div>
                </div>
            </div>

            <!-- PREVIEW SECTION -->
            <div id="preview" class="section">
                <div class="content">
                    <div id="relatorioContainer"></div>

                    <div style="display: flex; gap: 10px; margin-top: 30px; justify-content: center;">
                        <button class="btn btn-secondary" onclick="showSection('editor')">← Voltar ao Editor</button>
                        <button class="btn btn-primary" onclick="downloadPDF()">📥 Baixar PDF</button>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script>
        function showSection(sectionId) {
            document.querySelectorAll('.section').forEach(s => s.classList.remove('active'));
            document.getElementById(sectionId).classList.add('active');

            document.querySelectorAll('.nav-btn').forEach(btn => btn.classList.remove('active'));
            event.target.classList.add('active');

            if (sectionId === 'preview') {
                generatePreview();
            }
        }

        function generatePreview() {
            const clientName = document.getElementById('clientName').value || 'Cliente';
            const period = document.getElementById('period').value || 'Período';
            const reportTitle = document.getElementById('reportTitle').value || 'Relatório de Desempenho';
            const executive = document.getElementById('executive').value || '';
            const analysis = document.getElementById('analysis').value || '';
            const insights = document.getElementById('insights').value.split('\n').filter(i => i.trim());
            const recommendations = document.getElementById('recommendations').value.split('\n').filter(r => r.trim());
            const footer = document.getElementById('footer').value || '';

            const kpi1Label = document.getElementById('kpi1Label').value || 'KPI 1';
            const kpi1Value = document.getElementById('kpi1Value').value || '—';
            const kpi2Label = document.getElementById('kpi2Label').value || 'KPI 2';
            const kpi2Value = document.getElementById('kpi2Value').value || '—';
            const kpi3Label = document.getElementById('kpi3Label').value || 'KPI 3';
            const kpi3Value = document.getElementById('kpi3Value').value || '—';

            let html = `
                <div class="relatorio">
                    <div class="relatorio-header">
                        <div class="logo">
                            <div class="logo-icon">📊</div>
                        </div>
                        <h1>${reportTitle}</h1>
                        <div class="subtitle">${clientName}</div>
                        <div class="period">${period}</div>
                    </div>

                    <div class="section-title">📝 Resumo Executivo</div>
                    <div class="section-content">${executive.replace(/\n/g, '<br>')}</div>

                    <div class="section-title">📊 KPIs Principais</div>
                    <div class="kpi-grid">
                        <div class="kpi-card">
                            <div class="kpi-label">${kpi1Label}</div>
                            <div class="kpi-value">${kpi1Value}</div>
                        </div>
                        <div class="kpi-card">
                            <div class="kpi-label">${kpi2Label}</div>
                            <div class="kpi-value">${kpi2Value}</div>
                        </div>
                        <div class="kpi-card">
                            <div class="kpi-label">${kpi3Label}</div>
                            <div class="kpi-value">${kpi3Value}</div>
                        </div>
                    </div>

                    <div class="section-title">📈 Análise Detalhada</div>
                    <div class="section-content">${analysis.replace(/\n/g, '<br>')}</div>

                    <div class="section-title">💡 Principais Insights</div>
                    <ul class="recommendations">
                        ${insights.map(insight => `<li>• ${insight}</li>`).join('')}
                    </ul>

                    <div class="section-title">🎯 Recomendações</div>
                    <ul class="recommendations">
                        ${recommendations.map(rec => `<li><strong>→</strong> ${rec}</li>`).join('')}
                    </ul>

                    ${footer ? `<div class="section-title">📌 Próximos Passos</div><div class="section-content">${footer.replace(/\n/g, '<br>')}</div>` : ''}

                    <div class="relatorio-footer">
                        <p>📊 Relatório gerado pela <strong>LK Comunicação Digital</strong></p>
                        <p>Data: ${new Date().toLocaleDateString('pt-BR')}</p>
                    </div>
                </div>
            `;

            document.getElementById('relatorioContainer').innerHTML = html;
        }

        function downloadPDF() {
            const clientName = document.getElementById('clientName').value || 'Relatorio';
            const element = document.querySelector('.relatorio');

            if (!element) {
                alert('Clique em "Ver Prévia" primeiro para gerar o relatório');
                return;
            }

            const opt = {
                margin: 10,
                filename: `Relatorio_${clientName}_${new Date().toISOString().split('T')[0]}.pdf`,
                image: { type: 'jpeg', quality: 0.98 },
                html2canvas: { scale: 2 },
                jsPDF: { orientation: 'portrait', unit: 'mm', format: 'a4' }
            };

            html2pdf().set(opt).from(element).save();
        }

        function printReport() {
            const element = document.querySelector('.relatorio');
            if (!element) {
                alert('Clique em "Ver Prévia" primeiro para gerar o relatório');
                return;
            }

            const printWindow = window.open('', '', 'height=800,width=900');
            printWindow.document.write('<html><head><title>Imprimir Relatório</title>');
            printWindow.document.write('<style>body { font-family: Arial, sans-serif; } .relatorio { padding: 40px; }</style>');
            printWindow.document.write('</head><body>');
            printWindow.document.write(document.querySelector('.relatorio').innerHTML);
            printWindow.document.write('</body></html>');
            printWindow.document.close();
            printWindow.print();
        }

        function clearAll() {
            if (confirm('Tem certeza que deseja limpar todos os dados?')) {
                document.querySelectorAll('input[type="text"], textarea').forEach(el => el.value = '');
            }
        }
    </script>
</body>
</html>
