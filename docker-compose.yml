version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: roteirista_postgres
    environment:
      POSTGRES_USER: roteirista
      POSTGRES_PASSWORD: roteirista_dev_password
      POSTGRES_DB: roteirista_dev
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U roteirista"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
